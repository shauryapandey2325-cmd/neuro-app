/* ============================================================================
   NEURO — parent-facing app that reads an autistic child's nervous-system
   arousal from a wearable band and warns before a meltdown.

   This is a demo-ready prototype. The data layer is deliberately abstracted so
   the same app can run on a real Bluetooth wearable later (see DATA LAYER).
   ========================================================================== */

/* ----------------------------- DESIGN TOKENS ------------------------------ */
const C = {
  bg: "#FFF7EF",       // warm cream base — not clinical blue
  ink: "#2B2140",      // deep plum — the sleek dark edge
  ink2: "#6B5F7A",     // secondary text
  ink3: "#9C8FAA",     // muted
  line: "#F1E4E9",     // hairline
  card: "#FFFFFF",
  brand: "#FF6B4A",    // vivid coral — primary
  brandDeep: "#E14F30",
  gold: "#FFC93C",     // secondary accent
  calm: "#1FBF9F",
  rising: "#FFB627",
  overload: "#FF3D57",
};

const STATE = {
  calm:     { key: "calm",     label: "Calm",          color: C.calm,     soft: "#E4F9F3" },
  rising:   { key: "rising",   label: "Rising",        color: C.rising,   soft: "#FCEFD6" },
  overload: { key: "overload", label: "Overload risk", color: C.overload, soft: "#FDE4E2" },
};
const bandFor = (i) => (i < 40 ? STATE.calm : i < 72 ? STATE.rising : STATE.overload);

/* ============================== DATA LAYER =================================
   Sample shape emitted by any source: { eda(µS), hr(bpm), temp(°C), motion(0-1) }

   SimulatedSource scripts realistic physiology for the demo child. A real
   BLEDataSource would implement the same { start, stop, tick } contract:
   connect to the Empatica-style band over Bluetooth GATT, parse the EDA / PPG
   heart-rate / thermopile / accelerometer characteristics, and emit the exact
   same Sample shape — so nothing above this line has to change.
   ------------------------------------------------------------------------- */

// Timmy's learned baseline + his personal overload ceiling (the app
// personalizes to each child; these come from ~a week of his own data).
const BASE = { eda: 4.6, hr: 92, temp: 33.2, motion: 0.07 };
const PEAK = { eda: 19.5, hr: 146, temp: 33.9, motion: 0.62 };

function makeSimSource() {
  const s = {
    phase: "calm",     // calm | buildup | overload | recovery
    phaseT: 0,         // seconds elapsed in current phase
    v: { ...BASE },    // current smoothed values
    RAMP: 62, HOLD: 34, RECOVER: 78, // model-seconds per phase
  };
  const noise = (a) => (Math.random() * 2 - 1) * a;
  const ease = (cur, target, k) => cur + (target - cur) * k;
  const lerp = (a, b, t) => a + (b - a) * Math.min(1, Math.max(0, t));

  s.start = () => { s.phase = "buildup"; s.phaseT = 0; };
  s.reset = () => { s.phase = "calm"; s.phaseT = 0; s.v = { ...BASE }; };

  // advance model-time by dt seconds; returns a fresh Sample
  s.tick = (dt) => {
    s.phaseT += dt;
    let tgt;
    if (s.phase === "calm") {
      tgt = { ...BASE };
      // occasional harmless fidget
      if (Math.random() < 0.06) tgt.motion = 0.22;
    } else if (s.phase === "buildup") {
      const p = s.phaseT / s.RAMP;
      const curve = Math.pow(p, 1.35); // slow start, accelerating climb
      tgt = {
        eda: lerp(BASE.eda, PEAK.eda, curve),
        hr: lerp(BASE.hr, PEAK.hr, curve),
        temp: lerp(BASE.temp, PEAK.temp, curve),
        motion: lerp(BASE.motion, PEAK.motion, Math.pow(p, 1.6)),
      };
      if (s.phaseT >= s.RAMP) { s.phase = "overload"; s.phaseT = 0; }
    } else if (s.phase === "overload") {
      tgt = { ...PEAK };
      if (s.phaseT >= s.HOLD) { s.phase = "recovery"; s.phaseT = 0; }
    } else { // recovery
      const p = s.phaseT / s.RECOVER;
      tgt = {
        eda: lerp(PEAK.eda, BASE.eda, p),
        hr: lerp(PEAK.hr, BASE.hr, p),
        temp: lerp(PEAK.temp, BASE.temp, p),
        motion: lerp(PEAK.motion, BASE.motion, p),
      };
      if (s.phaseT >= s.RECOVER) { s.phase = "calm"; s.phaseT = 0; }
    }
    const k = 0.35;
    s.v = {
      eda: Math.max(1.5, ease(s.v.eda, tgt.eda, k) + noise(0.35)),
      hr: Math.max(70, ease(s.v.hr, tgt.hr, k) + noise(2.2)),
      temp: ease(s.v.temp, tgt.temp, 0.12) + noise(0.05),
      motion: Math.min(1, Math.max(0, ease(s.v.motion, tgt.motion, 0.4) + noise(0.05))),
    };
    return { ...s.v };
  };
  return s;
}

/* =========================== PREDICTION ENGINE ============================
   A rolling analysis of the live feed. Normalizes each signal against the
   child's own baseline/ceiling, weights EDA highest (it's the strongest
   arousal marker), and extrapolates the rate of climb to an ETA — the same
   "predict before it happens" idea the published research uses.
   ------------------------------------------------------------------------ */
function arousalFrom(sample) {
  const n = (x, lo, hi) => Math.min(1, Math.max(0, (x - lo) / (hi - lo)));
  const edaN = n(sample.eda, BASE.eda - 1.6, PEAK.eda);
  const hrN = n(sample.hr, BASE.hr - 8, PEAK.hr);
  const moN = n(sample.motion, BASE.motion, PEAK.motion);
  return Math.round(100 * (0.55 * edaN + 0.3 * hrN + 0.15 * moN));
}

/* ============================= SEED HISTORY ==============================
   Timmy's recent episodes with tagged triggers, so pattern insights are
   computed from real-looking data. New triggers logged live get prepended.
   ------------------------------------------------------------------------ */
const SEED_EPISODES = [
  { day: "Yesterday", time: "5:10 PM", hour: 17, trigger: "Loud restaurant", peak: "overload" },
  { day: "Yesterday", time: "8:25 AM", hour: 8, trigger: "Morning transition", peak: "rising" },
  { day: "Mon", time: "4:50 PM", hour: 16, trigger: "Crowded store", peak: "overload" },
  { day: "Sun", time: "6:05 PM", hour: 18, trigger: "Loud restaurant", peak: "overload" },
  { day: "Sat", time: "11:30 AM", hour: 11, trigger: "Unexpected change", peak: "rising" },
  { day: "Fri", time: "5:40 PM", hour: 17, trigger: "Loud restaurant", peak: "rising" },
  { day: "Thu", time: "3:15 PM", hour: 15, trigger: "Bright lights", peak: "rising" },
];

const TRIGGER_CHIPS = [
  { label: "Loud noise" },
  { label: "Bright lights" },
  { label: "Transition" },
  { label: "Crowd" },
  { label: "Hunger" },
  { label: "Tired" },
];

// group loud/crowd-ish triggers into an "environment" family for insights
const ENV = new Set(["Loud restaurant", "Loud noise", "Crowded store", "Crowd", "Bright lights"]);

function computeInsights(episodes) {
  if (!episodes.length) return [];
  const counts = {};
  episodes.forEach((e) => (counts[e.trigger] = (counts[e.trigger] || 0) + 1));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const envCount = episodes.filter((e) => ENV.has(e.trigger)).length;
  const pmCount = episodes.filter((e) => e.hour >= 16 && e.hour < 19).length;
  const out = [];
  if (envCount)
    out.push(`Loud or busy environments preceded ${envCount} of the last ${episodes.length} elevated episodes.`);
  if (pmCount >= 2)
    out.push(`Arousal clusters between 4–7 PM — ${pmCount} of ${episodes.length} recent episodes.`);
  if (top[1]) out.push(`"${top[1][0]}" is a repeat trigger (${top[1][1]}×).`);
  return out.slice(0, 3);
}

/* =============================== HELPERS ================================= */
const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

/* shrink an uploaded photo to a small square so it stores fast and cheap */
function resizePhoto(file, size = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image failed"));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadProfile() {
  try {
    const v = localStorage.getItem("neuro_profile");
    if (v) return JSON.parse(v);
  } catch (e) { /* no profile saved yet */ }
  return null;
}
async function saveProfile(p) {
  try { localStorage.setItem("neuro_profile", JSON.stringify(p)); }
  catch (e) { console.error("profile save failed", e); }
}

function Trace({ data, color, min, max }) {
  const W = 96, H = 34;
  if (data.length < 2) return <svg width={W} height={H} />;
  const span = Math.max(1, max - min);
  const step = W / (data.length - 1);
  const pts = data.map((v, i) => {
    const y = H - 3 - ((Math.min(max, Math.max(min, v)) - min) / span) * (H - 6);
    return `${(i * step).toFixed(1)},${y.toFixed(1)}`;
  });
  const last = pts[pts.length - 1].split(",");
  return (
    <svg width={W} height={H} style={{ overflow: "visible" }}>
      <polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth="2"
        strokeLinejoin="round" strokeLinecap="round" opacity="0.9" />
      <circle cx={last[0]} cy={last[1]} r="2.6" fill={color} />
    </svg>
  );
}

function Vital({ label, value, unit, data, color, min, max }) {
  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: "10px 12px", flex: 1 }}>
      <div className="flex items-center gap-1" style={{ color: C.ink3 }}>
        <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.4, textTransform: "uppercase" }}>{label}</span>
      </div>
      <div className="flex items-end justify-between" style={{ marginTop: 2 }}>
        <div style={{ color: C.ink, fontWeight: 700, fontSize: 20, letterSpacing: -0.5, fontVariantNumeric: "tabular-nums" }}>
          {value}<span style={{ fontSize: 11, color: C.ink3, fontWeight: 600, marginLeft: 2 }}>{unit}</span>
        </div>
        <Trace data={data} color={color} min={min} max={max} />
      </div>
    </div>
  );
}

/* ================================ APP =================================== */
function Neuro() {
  const [tab, setTab] = useState("home");
  const [samples, setSamples] = useState([{ ...BASE }]);
  const [arousal, setArousal] = useState(arousalFrom(BASE));
  const [eta, setEta] = useState(null);           // predicted seconds to overload
  const [alerts, setAlerts] = useState([]);
  const [episodes, setEpisodes] = useState(SEED_EPISODES);
  const [logged, setLogged] = useState(null);      // toast after logging a trigger
  const [loc, setLoc] = useState({ x: 0.5, y: 0.56, inZone: true, dist: 0 });
  const [openTool, setOpenTool] = useState(null);
  const [presenter, setPresenter] = useState(false);
  const [speed, setSpeed] = useState(3);

  // profile — real name + real uploaded photo, persisted per-browser
  const [profile, setProfile] = useState(null);
  const [profileChecked, setProfileChecked] = useState(false);
  const [obName, setObName] = useState("Timmy");
  const [obPhoto, setObPhoto] = useState(null);
  const [obError, setObError] = useState("");

  // dev/demo panel — gated so only people who know the PIN can open it
  const [devUnlocked, setDevUnlocked] = useState(false);
  const [pinPrompt, setPinPrompt] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);

  // real device location for the safe-zone anchor
  const [home, setHome] = useState(null);
  const [geoStatus, setGeoStatus] = useState("idle"); // idle | granted | denied | unsupported

  // AI coach (real Claude API call)
  const [coachMsgs, setCoachMsgs] = useState([]);
  const [coachInput, setCoachInput] = useState("");
  const [coachLoading, setCoachLoading] = useState(false);

  // feedback survey
  const [surveyOpen, setSurveyOpen] = useState(false);
  const [surveyAns, setSurveyAns] = useState({ clarity: 0, trust: 0, note: "" });
  const [surveyDone, setSurveyDone] = useState(false);

  useEffect(() => {
    loadProfile().then((p) => { if (p) setProfile(p); setProfileChecked(true); });
  }, []);

  // mutable simulation + prediction memory (avoids stale closures in the loop)
  const sim = useRef(makeSimSource());
  const idxHist = useRef([]);        // [{t, idx}] for slope/ETA
  const modelT = useRef(0);
  const flags = useRef({ predicted: false, overload: false, wasElevated: false });
  const locTarget = useRef(null);    // {x,y} when eloping
  const speedRef = useRef(speed);
  useEffect(() => { speedRef.current = speed; }, [speed]);

  const band = bandFor(arousal);

  const pushAlert = (a) => setAlerts((prev) => [{ id: Date.now() + Math.random(), time: now(), ...a }, ...prev].slice(0, 40));

  /* ------------------------------ tick loop ------------------------------ */
  useEffect(() => {
    const dtReal = 0.4;
    const timer = setInterval(() => {
      const dt = dtReal * speedRef.current;
      modelT.current += dt;

      const sample = sim.current.tick(dt);
      setSamples((prev) => [...prev.slice(-47), sample]);

      const idx = arousalFrom(sample);
      setArousal(idx);

      // slope over last ~6s of model-time → ETA to overload (idx 72)
      const hist = idxHist.current;
      hist.push({ t: modelT.current, idx });
      while (hist.length && modelT.current - hist[0].t > 6) hist.shift();
      let slope = 0;
      if (hist.length > 2) {
        const a = hist[0], b = hist[hist.length - 1];
        slope = (b.idx - a.idx) / Math.max(0.5, b.t - a.t); // idx per second
      }
      let etaSec = null;
      if (slope > 0.4 && idx < 72) etaSec = Math.min(300, Math.max(12, (72 - idx) / slope));
      setEta(etaSec);

      const bnd = bandFor(idx);
      const f = flags.current;

      // episode lifecycle → predictive + overload alerts (debounced once each)
      const elevated = idx >= 40;
      if (elevated && !f.wasElevated) { f.predicted = false; f.overload = false; }
      f.wasElevated = elevated;

      if (bnd.key === "rising" && slope > 0.55 && etaSec && etaSec < 150 && !f.predicted) {
        f.predicted = true;
        pushAlert({ type: "predict", eta: Math.round(etaSec) });
      }
      if (bnd.key === "overload" && !f.overload) {
        f.overload = true;
        pushAlert({ type: "overload" });
      }
      if (bnd.key === "calm" && f.overload) {
        f.overload = false;
        pushAlert({ type: "recovered" });
      }

      // location easing (elopement demo)
      if (locTarget.current) {
        setLoc((p) => {
          const nx = p.x + (locTarget.current.x - p.x) * 0.08;
          const ny = p.y + (locTarget.current.y - p.y) * 0.08;
          const d = Math.hypot(nx - 0.5, ny - 0.56);
          const inZone = d < 0.26;
          if (!inZone && p.inZone) pushAlert({ type: "elope", dist: Math.round(d * 900) });
          return { x: nx, y: ny, inZone, dist: Math.round(d * 900) };
        });
      }
    }, 400);
    return () => clearInterval(timer);
  }, []);

  /* ---------------------------- presenter actions ------------------------ */
  const triggerEvent = () => {
    sim.current.start();
    setEpisodes((p) => [{ day: "Now", time: now(), hour: new Date().getHours(), trigger: "Loud restaurant", peak: "overload" }, ...p]);
    pushAlert({ type: "context", text: "Session started — arousal climbing." });
  };
  const triggerElope = () => {
    locTarget.current = { x: 0.86, y: 0.16 };
    try {
      if (window.speechSynthesis) {
        const msg = new SpeechSynthesisUtterance(
          `${(profile && profile.name) || "Timmy"}, it's time to come back home.`
        );
        window.speechSynthesis.speak(msg);
      }
    } catch (e) { /* speech not available in this environment */ }
  };

  const requestRealLocation = () => {
    if (!navigator.geolocation) { setGeoStatus("unsupported"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setHome({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setGeoStatus("granted"); },
      () => { setGeoStatus("denied"); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const askCoach = async (text) => {
    const userMsg = { role: "user", content: text };
    setCoachMsgs((p) => [...p, userMsg]);
    setCoachInput("");
    setCoachLoading(true);
    // NOTE: the Claude Artifact version of this app calls the Anthropic API
    // directly because Claude.ai proxies that request for you. A bare static
    // page can't safely do that — an API key can't live in public page code,
    // and the browser can't call api.anthropic.com directly anyway (no CORS).
    // Wire this up to a small serverless proxy (e.g. a Cloudflare Worker or
    // Vercel function that holds the real key) when you're ready, then swap
    // this block back to a fetch() call to your own endpoint.
    await new Promise((r) => setTimeout(r, 500));
    setCoachMsgs((p) => [...p, { role: "assistant", content: "The coach needs a small backend to safely call Claude from a public site — it isn't wired up yet on this deployment. Ask Claude to help set up a free serverless proxy (Cloudflare Worker / Vercel function) to finish this." }]);
    setCoachLoading(false);
  };

  const submitSurvey = async () => {
    try {
      // Stored locally in this browser only. There's no backend here, so
      // responses don't centralize across visitors — for real aggregate
      // data, point this at a free form endpoint (e.g. Formspree) instead.
      const all = JSON.parse(localStorage.getItem("neuro_surveys") || "[]");
      all.push({ ...surveyAns, ts: Date.now() });
      localStorage.setItem("neuro_surveys", JSON.stringify(all));
    } catch (e) { console.error("survey save failed", e); }
    setSurveyDone(true);
    setTimeout(() => { setSurveyOpen(false); setSurveyDone(false); setSurveyAns({ clarity: 0, trust: 0, note: "" }); }, 1600);
  };

  const completeOnboarding = async () => {
    if (!obPhoto) { setObError("Please add a photo to continue."); return; }
    const p = { name: obName.trim() || "Timmy", photo: obPhoto };
    setProfile(p);
    await saveProfile(p);
  };
  const resetAll = () => {
    sim.current.reset();
    idxHist.current = [];
    flags.current = { predicted: false, overload: false, wasElevated: false };
    locTarget.current = null;
    setLoc({ x: 0.5, y: 0.56, inZone: true, dist: 0 });
    setEta(null);
  };

  const logTrigger = (label) => {
    setEpisodes((p) => [{ day: "Now", time: now(), hour: new Date().getHours(), trigger: label, peak: band.key }, ...p]);
    setLogged(label);
    setTimeout(() => setLogged(null), 1900);
  };

  const insights = useMemo(() => computeInsights(episodes), [episodes]);

  const edaArr = samples.map((s) => s.eda);
  const hrArr = samples.map((s) => s.hr);
  const moArr = samples.map((s) => s.motion);
  const cur = samples[samples.length - 1];

  const childName = (profile && profile.name) || "Timmy";
  const sentence = (() => {
    if (band.key === "overload") return `${childName} is at or near sensory overload. Step in now.`;
    if (band.key === "rising")
      return eta ? `${childName}'s arousal is climbing — at this rate, overload in about ${etaLabel(eta)}.` : `${childName} is showing early signs of arousal.`;
    return `${childName} is calm and regulated.`;
  })();

  return (
    <div style={{ background: C.bg, minHeight: "100%", display: "flex", justifyContent: "center", padding: "18px 12px", fontFamily: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" }}>
      <style>{`
        @keyframes breathe { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.12);opacity:1} }
        @keyframes livepulse { 0%,100%{opacity:.35} 50%{opacity:1} }
        @keyframes slideup { from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }
        .nr-tap{transition:transform .12s ease, background .15s ease} .nr-tap:active{transform:scale(.97)}
        @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
      `}</style>

      {/* phone frame */}
      <div style={{ width: "100%", maxWidth: 392, height: 812, background: C.card, borderRadius: 40, border: `1px solid ${C.line}`, boxShadow: "0 24px 60px rgba(43,33,64,.18)", overflow: "hidden", display: "flex", flexDirection: "column", position: "relative" }}>

        {profileChecked && !profile && (
          <div style={{ position: "absolute", inset: 0, background: C.bg, zIndex: 40, display: "flex", flexDirection: "column", padding: "36px 22px 26px", overflowY: "auto" }}>
            <div style={{ width: 44, height: 44, borderRadius: 13, background: C.brand, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
              
            </div>
            <div style={{ fontWeight: 800, fontSize: 22, color: C.ink, letterSpacing: -0.4 }}>Set up Neuro</div>
            <div style={{ fontSize: 13, color: C.ink2, marginTop: 6, marginBottom: 22, lineHeight: 1.4 }}>
              A quick profile so the app can speak in plain language about your child. Your name and photo stay on this device only.
            </div>

              {pinError && <div style={{ fontSize: 11.5, color: C.overload, marginBottom: 8 }}>Wrong PIN — try again.</div>}
              <button className="nr-tap" onClick={() => {
                if (pinInput === DEV_PIN) { setDevUnlocked(true); setPresenter(true); setPinPrompt(false); setPinInput(""); }
                else setPinError(true);
              }} style={{ ...btn(C.ink), width: "100%" }}>Unlock</button>
            </div>
          </div>
        )}

        {/* feedback / validation survey */}
        {surveyOpen && (
          <div onClick={() => !surveyDone && setSurveyOpen(false)} style={{ position: "absolute", inset: 0, background: "rgba(30,20,40,.5)", display: "flex", alignItems: "flex-end", zIndex: 25 }}>
            <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", background: C.card, borderRadius: "24px 24px 0 0", padding: "18px 18px 26px", animation: "slideup .25s ease" }}>
              {surveyDone ? (
                <div style={{ textAlign: "center", padding: "20px 0" }}>
                  
                  <div style={{ fontWeight: 800, fontSize: 15, color: C.ink, marginTop: 8 }}>Thanks for the feedback!</div>
                </div>
              ) : (
                <>
                  <div className="flex items-center justify-between" style={{ marginBottom: 10 }}>
                    <div style={{ fontWeight: 800, fontSize: 16, color: C.ink }}>Quick feedback</div>
                    <button onClick={() => setSurveyOpen(false)} style={{ background: "none", border: "none", color: C.ink3, cursor: "pointer" }}>×</button>
                  </div>
                  {[
                    { k: "clarity", q: "How clear was the live signal display?" },
                    { k: "trust", q: "How much would you trust this alert?" },
                  ].map((row) => (
                    <div key={row.k} style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 6 }}>{row.q}</div>
                      <div className="flex gap-2">
                        {[1, 2, 3, 4, 5].map((n) => (
                          <button key={n} onClick={() => setSurveyAns((p) => ({ ...p, [row.k]: n }))}
                            style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: `1px solid ${C.line}`, cursor: "pointer", fontWeight: 700, background: surveyAns[row.k] === n ? C.brand : C.card, color: surveyAns[row.k] === n ? "#fff" : C.ink }}>
                            {n}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.ink, marginBottom: 6 }}>What should we improve?</div>
                  <textarea value={surveyAns.note} onChange={(e) => setSurveyAns((p) => ({ ...p, note: e.target.value }))}
                    rows={3} placeholder="Optional…"
                    style={{ width: "100%", border: `1px solid ${C.line}`, borderRadius: 12, padding: "10px 12px", fontSize: 13, outline: "none", resize: "none", marginBottom: 12, fontFamily: "inherit" }} />
                  <button className="nr-tap" disabled={!surveyAns.clarity || !surveyAns.trust} onClick={submitSurvey}
                    style={{ ...btn(C.brand), width: "100%", opacity: !surveyAns.clarity || !surveyAns.trust ? 0.5 : 1 }}>Submit</button>
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------- small components --------------------------- */
function etaLabel(sec) {
  if (sec >= 90) return `${Math.round(sec / 60)} min`;
  if (sec >= 55) return `1 min`;
  return `${Math.round(sec / 5) * 5}s`;
}
const btn = (bg) => ({ flex: 1, background: bg, color: "#fff", border: "none", borderRadius: 14, padding: "13px 0", fontWeight: 700, fontSize: 13.5, cursor: "pointer" });
const btnGhost = () => ({ flex: 1, background: C.card, color: C.ink, border: `1px solid ${C.line}`, borderRadius: 14, padding: "13px 0", fontWeight: 700, fontSize: 13.5, cursor: "pointer" });
const sheetBtn = (bg) => ({ width: "100%", background: bg, color: "#fff", border: "none", borderRadius: 14, padding: "13px 0", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 9 });

function SectionTitle({ children }) {
  return <div style={{ fontWeight: 800, fontSize: 20, color: C.ink, letterSpacing: -.4, marginBottom: 14 }}>{children}</div>;
}
function Card({ children }) {
  return <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, padding: 15, marginBottom: 12 }}>{children}</div>;
}
function CardLabel({ children, style }) {
  return <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: .5, textTransform: "uppercase", color: C.ink3, ...style }}>{children}</div>;
}
function Empty({ children }) {
  return (
    <div style={{ textAlign: "center", padding: "40px 20px", color: C.ink3 }}>
      <div style={{ fontSize: 13, marginTop: 10, lineHeight: 1.4 }}>{children}</div>
    </div>
  );
}
function AlertRow({ a }) {
  const map = {
    predict: { color: C.rising, title: `At this rate, overload in ~${etaLabel(a.eta)}`, sub: "Arousal climbing fast" },
    overload: { color: C.overload, title: "Sensory overload", sub: "Step in now" },
    recovered: { color: C.calm, title: "Back to calm", sub: "Arousal has settled" },
    elope: { color: C.overload, title: "Left the safe zone", sub: `~${a.dist} m from home` },
    context: { color: C.brand, title: a.text, sub: "" },
  };
  const m = map[a.type] || map.context;
  return (
    <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "11px 13px", display: "flex", alignItems: "center", gap: 11 }}>
      <div style={{ width: 34, height: 34, borderRadius: 10, background: m.color + "1A", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontWeight: 700, fontSize: 13.5, color: C.ink }}>{m.title}</div>
        {m.sub && <div style={{ fontSize: 11.5, color: C.ink3 }}>{m.sub}</div>}
      </div>
      <div style={{ fontSize: 11, color: C.ink3, fontWeight: 600 }}>{a.time}</div>
    </div>
  );
}

function BreathingGuide() {
  const [t, setT] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setT((x) => x + 1), 1000);
    return () => clearInterval(id);
  }, []);
  const pos = t % 19; // 4-7-8 cycle
  let phase, count;
  if (pos < 4) { phase = "in"; count = 4 - pos; }
  else if (pos < 11) { phase = "hold"; count = 11 - pos; }
  else { phase = "out"; count = 19 - pos; }
  const scale = phase === "out" ? 0.62 : 1;
  const labels = { in: "Breathe in", hold: "Hold", out: "Breathe out" };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "6px 0 14px" }}>
      <div style={{ width: 96, height: 96, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
        <div style={{ position: "absolute", width: 96, height: 96, borderRadius: "50%", background: `radial-gradient(circle, ${C.brand}33, transparent 70%)`, transform: `scale(${scale})`, transition: "transform 1s linear" }} />
        <div style={{ width: 70, height: 70, borderRadius: "50%", border: `3px solid ${C.brand}`, transform: `scale(${scale})`, transition: "transform 1s linear", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 22, color: C.brandDeep, fontVariantNumeric: "tabular-nums" }}>{count}</div>
      </div>
      <div style={{ fontWeight: 700, fontSize: 14, color: C.ink, marginTop: 8 }}>{labels[phase]}</div>
    </div>
  );
}

function MiniMap({ loc }) {
  const W = 340, H = 210;
  const cx = loc.x * W, cy = loc.y * H;
  const hx = 0.5 * W, hy = 0.56 * H;
  const R = 0.26 * W;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ borderRadius: 18, border: `1px solid ${C.line}`, background: "#EAF0F4", display: "block" }}>
      {/* stylized blocks & roads */}
      <rect x="0" y="0" width={W} height={H} fill="#EAF0F4" />
      {[40, 120, 200, 280].map((x) => <rect key={x} x={x} y="0" width="20" height={H} fill="#E1E9EF" />)}
      {[50, 130].map((y) => <rect key={y} x="0" y={y} width={W} height="18" fill="#E1E9EF" />)}
      {/* safe zone */}
      <circle cx={hx} cy={hy} r={R} fill={loc.inZone ? C.calm + "22" : C.overload + "1F"} stroke={loc.inZone ? C.calm : C.overload} strokeWidth="2" strokeDasharray="6 5" />
      {/* home */}
      <g transform={`translate(${hx - 10},${hy - 10})`}>
        <rect x="0" y="0" width="20" height="20" rx="6" fill={C.ink} />
        <path d="M4 10 L10 5 L16 10 L16 16 L4 16 Z" fill="#fff" />
      </g>
      {/* child */}
      <g style={{ transition: "transform .3s ease" }}>
        <circle cx={cx} cy={cy} r="13" fill={loc.inZone ? C.brand : C.overload} opacity="0.25" />
        <circle cx={cx} cy={cy} r="7" fill={loc.inZone ? C.brand : C.overload} stroke="#fff" strokeWidth="2.5" />
      </g>
    </svg>
  );
}
